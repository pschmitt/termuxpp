name: nixpp

on:
  push:
    branches:
      - main
    paths:
      - 'pkgs/**'
      - flake.nix
      - flake.lock
      - .github/workflows/nixpp.yml

concurrency:
  group: nixpp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # nixos-config builds these with its own nixpkgs (termuxpp.inputs.nixpkgs
  # follows it), so this flake's Circus builds do not match its guest systems.
  # Prewarm the cache with the consumer's pin for its next termuxpp bump.
  nixos-config:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-consumer-build.yaml@main
    with:
      packages: >-
        packages.aarch64-linux.nixpp
        packages.aarch64-linux.termuxpp-api
        packages.aarch64-linux.termuxpp-ip
        packages.aarch64-linux.termuxpp-rish
        packages.aarch64-linux.termuxpp-storage
      pin-prefix: gh-termuxpp-main-nixos-config
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
