// Packs the native "tpp" CLI into the APK, so the app installs and updates it in the native prefix itself
// (com.termux.app.nativecli). No Debian package is involved.
//
//   stageTppNative       assets/tpp-native/{manifest.json,files/...}: termux-callback and the completions,
//                        with the files list the installer works from (the binaries come from the tasks
//                        below; the API commands are in the tpp binary, no command script is packed)
//   buildTppRust         lib/<abi>/libtpp.so: the one tpp executable (Rust workspace, crate tpp-cli with
//                        the session control crate linked in), built with cargo and the NDK linker for
//                        each ABI. tpp carries its command table, help, output rendering, completion and
//                        the session control (tpp session). Needs cargo with the Android targets on
//                        the PATH (the dev shell has them), or -PtppCargo=/path/to/cargo
//   buildTppNativeBridge lib/<abi>/libtermux-api-broadcast.so: the native client of the in-app API.
//                        It is an executable; the lib*.so name makes Android extract it to the native
//                        library directory, where the installer links it (the same convention Rust
//                        binaries follow: add their lib*.so to jniLibs and a "lib" entry to the manifest)
//
// The installer replaces @TERMUX_PREFIX@ in the scripts when it installs them.

import groovy.json.JsonOutput

import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

def apiPackage = rootProject.file("pkgs/tpp-api-bridge")
def generated = layout.buildDirectory.dir("generated/tppNative").get().asFile
def assetsRoot = new File(generated, "assets")
def jniLibsRoot = new File(generated, "jniLibs")
def rustLibsRoot = new File(generated, "rustLibs")

// Keep the input set and digest format in sync with pkgs/nixpp/tpp.nix.
def tppVersionSources = rootProject.fileTree(rootProject.projectDir) {
    include "Cargo.toml", "Cargo.lock",
        "pkgs/tpp-cli/Cargo.toml", "pkgs/tpp-api/Cargo.toml", "pkgs/tpp-session/Cargo.toml",
        "pkgs/tpp-cli/src/**", "pkgs/tpp-api/src/**", "pkgs/tpp-api/help/**",
        "pkgs/tpp-session/src/**"
}

tasks.register("stageTppNative") {
    inputs.dir(apiPackage).withPropertyName("apiPackage")
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(tppVersionSources).withPropertyName("tppVersionSources")
        .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(assetsRoot)

    doLast {
        def out = new File(assetsRoot, "tpp-native")
        delete(out)
        def files = new File(out, "files")
        def entries = []

        def asset = { String dest, File source, boolean executable, boolean subst ->
            def target = new File(files, dest)
            target.parentFile.mkdirs()
            Files.copy(source.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
            entries << [path: dest, type: "asset", source: "tpp-native/files/" + dest,
                        executable: executable, subst: subst]
        }

        asset("libexec/termux-callback", new File(apiPackage, "termux-callback.in"), true, true)
        asset("share/bash-completion/completions/tpp", new File(apiPackage, "completions/tpp.bash"), false, false)
        asset("share/zsh/site-functions/_tpp", new File(apiPackage, "completions/tpp.zsh"), false, false)
        asset("share/fish/vendor_completions.d/tpp.fish", new File(apiPackage, "completions/tpp.fish"), false, false)

        def sha256 = { byte[] bytes -> MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString() }
        def sources = new TreeMap<String, File>()
        tppVersionSources.visit { details ->
            if (!details.directory) sources.put(details.relativePath.pathString, details.file)
        }
        def sourceHashes = sources.collect { path, file -> path + " " + sha256(file.bytes) + "\n" }.join()
        def versionFile = new File(files, "share/tpp/source-version")
        versionFile.parentFile.mkdirs()
        versionFile.setText(sha256(sourceHashes.getBytes("UTF-8")) + "\n", "UTF-8")
        entries << [path: "share/tpp/source-version", type: "asset", source: "tpp-native/files/share/tpp/source-version"]

        // One executable for the dispatcher, the API commands and the session control; there
        // are no command scripts
        entries << [path: "bin/tpp", type: "lib", source: "libtpp.so", executable: true]
        entries << [path: "libexec/termux-api-broadcast", type: "lib", source: "libtermux-api-broadcast.so",
                    executable: true]
        // Kept for compatibility with scripts that call the old client name.
        entries << [path: "libexec/termux-api", type: "symlink", target: "termux-api-broadcast"]

        new File(out, "manifest.json").text =
            JsonOutput.prettyPrint(JsonOutput.toJson([version: 1, entries: entries])) + "\n"
    }
}

tasks.register("buildTppRust") {
    def workspace = rootProject.projectDir
    def crates = ["tpp-cli", "tpp-session", "tpp-api"].collect { new File(workspace, "pkgs/$it") }
    inputs.files(crates.collect { fileTree(it) { exclude "target/**" } })
    inputs.file(new File(workspace, "Cargo.toml"))
    inputs.file(new File(workspace, "Cargo.lock"))
    inputs.property("minSdk", project.properties.minSdkVersion)
    outputs.dir(rustLibsRoot)

    doLast {
        def ndk = android.ndkDirectory
        if (ndk == null) throw new GradleException("The Android NDK is not available")
        def hostTag = org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "darwin-x86_64"
            : org.gradle.internal.os.OperatingSystem.current().isWindows() ? "windows-x86_64" : "linux-x86_64"
        def bin = new File(ndk, "toolchains/llvm/prebuilt/" + hostTag + "/bin")
        def cargo = project.findProperty("tppCargo") ?: "cargo"
        def targetDir = layout.buildDirectory.dir("tppRustTarget").get().asFile
        // ABI, Rust target and the NDK clang triple
        def abis = [["arm64-v8a", "aarch64-linux-android", "aarch64-linux-android"],
                    ["armeabi-v7a", "armv7-linux-androideabi", "armv7a-linux-androideabi"],
                    ["x86", "i686-linux-android", "i686-linux-android"],
                    ["x86_64", "x86_64-linux-android", "x86_64-linux-android"]]
        delete(rustLibsRoot)
        abis.each { abi, rustTarget, clangTriple ->
            def clang = new File(bin, clangTriple + project.properties.minSdkVersion + "-clang").path
            def env = rustTarget.toUpperCase().replace("-", "_")
            def builder = new ProcessBuilder([cargo, "build", "--release", "--locked", "--offline",
                                              "--manifest-path", new File(workspace, "Cargo.toml").path,
                                              "-p", "tpp", "--target", rustTarget,
                                              "--target-dir", targetDir.path])
            builder.environment().put("CARGO_TARGET_" + env + "_LINKER", clang)
            builder.environment().put("CARGO_HOME", new File(targetDir, "cargo-home").path)
            builder.environment().put("CARGO_ENCODED_RUSTFLAGS", "--remap-path-prefix=" + workspace.path + "=.")
            builder.redirectErrorStream(true)
            def process = builder.start()
            def log = process.inputStream.text
            if (process.waitFor() != 0)
                throw new GradleException("Could not build tpp for " + abi + ":\n" + log)
            def output = new File(rustLibsRoot, abi + "/libtpp.so")
            output.parentFile.mkdirs()
            Files.copy(new File(targetDir, rustTarget + "/release/tpp").toPath(), output.toPath(),
                       StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.register("buildTppNativeBridge") {
    def sources = ["termux-api.c", "termux-api-broadcast.c", "termux-api.h"].collect { new File(apiPackage, it) }
    inputs.files(sources)
    inputs.property("minSdk", project.properties.minSdkVersion)
    outputs.dir(jniLibsRoot)

    doLast {
        def ndk = android.ndkDirectory
        if (ndk == null) throw new GradleException("The Android NDK is not available")
        def hostTag = org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "darwin-x86_64"
            : org.gradle.internal.os.OperatingSystem.current().isWindows() ? "windows-x86_64" : "linux-x86_64"
        def bin = new File(ndk, "toolchains/llvm/prebuilt/" + hostTag + "/bin")
        def triples = ["arm64-v8a": "aarch64-linux-android", "armeabi-v7a": "armv7a-linux-androideabi",
                       "x86": "i686-linux-android", "x86_64": "x86_64-linux-android"]
        delete(jniLibsRoot)
        triples.each { abi, triple ->
            def output = new File(jniLibsRoot, abi + "/libtermux-api-broadcast.so")
            output.parentFile.mkdirs()
            def command = [new File(bin, triple + project.properties.minSdkVersion + "-clang").path,
                           "-std=gnu11", "-Wall", "-Os", "-fPIE", "-pie", "-fno-stack-protector",
                           "-Wl,--gc-sections", "-Wl,--build-id=sha1",
                           "-ffile-prefix-map=" + apiPackage.path + "=.",
                           "-o", output.path,
                           new File(apiPackage, "termux-api.c").path,
                           new File(apiPackage, "termux-api-broadcast.c").path]
            def process = new ProcessBuilder(command).redirectErrorStream(true).start()
            def log = process.inputStream.text
            if (process.waitFor() != 0)
                throw new GradleException("Could not build the native API client for " + abi + ":\n" + log)
        }
    }
}

android.sourceSets.main.assets.srcDir(files(assetsRoot).builtBy("stageTppNative"))
android.sourceSets.main.jniLibs.srcDir(files(jniLibsRoot).builtBy("buildTppNativeBridge"))
android.sourceSets.main.jniLibs.srcDir(files(rustLibsRoot).builtBy("buildTppRust"))

tasks.configureEach { task ->
    if (task.name == "preBuild") task.dependsOn("stageTppNative", "buildTppNativeBridge", "buildTppRust")
}
